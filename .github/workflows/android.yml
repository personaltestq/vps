name: Android ARM via ws-scrcpy

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Marcar horário de início
        run: echo "START_TS=$(date +%s)" >> "$GITHUB_ENV"

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar nginx e ws-scrcpy
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx apache2-utils build-essential python3
          git clone --depth 1 https://github.com/NetrisTV/ws-scrcpy.git "$HOME/ws-scrcpy"
          cd "$HOME/ws-scrcpy"
          npm install

      - name: Login (nginx) na frente do ws-scrcpy
        run: |
          PASS=$(openssl rand -hex 6)
          echo "PASS=$PASS" >> "$GITHUB_ENV"
          sudo htpasswd -bc /etc/nginx/.htpasswd admin "$PASS"
          sudo tee /etc/nginx/conf.d/ws.conf > /dev/null <<EOF
          server {
            listen 8080;
            auth_basic "restrito";
            auth_basic_user_file /etc/nginx/.htpasswd;
            location / {
              proxy_pass http://127.0.0.1:8000;
              proxy_http_version 1.1;
              proxy_set_header Upgrade \$http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_set_header Host \$host;
              proxy_read_timeout 86400;
            }
          }
          EOF
          sudo nginx -t
          sudo systemctl restart nginx

      - name: Subir cloudflared e logar acesso
        run: |
          curl -fsSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          ./cloudflared tunnel --url http://localhost:8080 --no-autoupdate > /tmp/cf.log 2>&1 &

          URL=""
          for i in $(seq 1 30); do
            URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' /tmp/cf.log | head -n1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done

          echo "=============================================="
          echo "URL: $URL"
          echo "USUARIO: admin"
          echo "SENHA: $PASS"
          echo "=============================================="
          {
            echo "### Acesso ao Android"
            echo "URL: $URL"
            echo ""
            echo "Usuário: \`admin\` | Senha: \`$PASS\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Criar script keep-alive
        run: |
          cat > /tmp/keepalive.sh <<'EOF'
          #!/usr/bin/env bash
          adb shell getprop ro.build.version.release
          echo "ABIs: $(adb shell getprop ro.product.cpu.abilist)"

          cd "$HOME/ws-scrcpy"
          nohup npm start > /tmp/wsscrcpy.log 2>&1 &
          sleep 20
          tail -n 20 /tmp/wsscrcpy.log

          DEADLINE=$(( START_TS + 355*60 ))
          echo "Emulador no ar até $(date -d @$DEADLINE)"
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            sleep 30
          done
          echo "Tempo esgotado, encerrando."
          EOF
          chmod +x /tmp/keepalive.sh

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis_playstore
          arch: x86_64
          cores: 4
          ram-size: 10240M
          heap-size: 1024M
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -no-metrics -skin 720x1280 -gpu swiftshader_indirect
          script: bash /tmp/keepalive.sh
