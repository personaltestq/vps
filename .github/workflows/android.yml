name: Android ARM via VNC

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DISPLAY: ":99"
    steps:
      - name: Marcar horário de início
        run: echo "START_TS=$(date +%s)" >> "$GITHUB_ENV"

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instalar Xvfb, VNC, noVNC e scrcpy
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11vnc novnc websockify scrcpy libpulse0 libxkbfile1 libxcb-xinerama0

      - name: Subir display virtual + VNC + noVNC
        run: |
          VNC_PASS=$(openssl rand -hex 6)
          echo "VNC_PASS=$VNC_PASS" >> "$GITHUB_ENV"

          # Display do mesmo tamanho da janela do scrcpy (sem bordas pretas)
          Xvfb :99 -screen 0 720x1280x24 &
          sleep 3
          x11vnc -display :99 -forever -shared -passwd "$VNC_PASS" -localhost -rfbport 5900 -bg -quiet
          websockify --web=/usr/share/novnc 6080 localhost:5900 > /tmp/novnc.log 2>&1 &
          sleep 2

      - name: Subir cloudflared (quick tunnel) e logar acesso
        run: |
          curl -fsSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          ./cloudflared tunnel --url http://localhost:6080 --no-autoupdate > /tmp/cf.log 2>&1 &

          URL=""
          for i in $(seq 1 30); do
            URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' /tmp/cf.log | head -n1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done

          FULL="$URL/vnc.html?autoconnect=1&resize=scale&password=$VNC_PASS"

          echo "=============================================="
          echo "URL BASE: $URL"
          echo "URL DIRETA: $FULL"
          echo "SENHA: $VNC_PASS"
          echo "=============================================="
          {
            echo "### Acesso ao Android"
            echo "URL direta: $FULL"
            echo ""
            echo "Senha: \`$VNC_PASS\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Criar script keep-alive
        run: |
          cat > /tmp/keepalive.sh <<'EOF'
          #!/usr/bin/env bash
          adb shell getprop ro.build.version.release
          echo "ABIs: $(adb shell getprop ro.product.cpu.abilist)"

          start_scrcpy() {
            SDL_RENDER_DRIVER=software nohup scrcpy \
              --no-audio \
              --max-size 1280 \
              --window-borderless \
              --window-x 0 --window-y 0 \
              --window-width 720 --window-height 1280 \
              > /tmp/scrcpy.log 2>&1 &
          }

          start_scrcpy
          sleep 8
          cat /tmp/scrcpy.log

          DEADLINE=$(( START_TS + 355*60 ))
          echo "Emulador no ar até $(date -d @$DEADLINE)"
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            # reabre o scrcpy se ele cair
            pgrep -x scrcpy > /dev/null || start_scrcpy
            sleep 30
          done
          echo "Tempo esgotado, encerrando."
          EOF
          chmod +x /tmp/keepalive.sh

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis_playstore
          arch: x86_64
          cores: 4
          ram-size: 4096M
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -no-metrics -skin 720x1280 -gpu swiftshader_indirect
          script: bash /tmp/keepalive.sh
