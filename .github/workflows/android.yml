name: Android 10 via VNC

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DISPLAY: ":99"
    steps:
      - name: Marcar horário de início
        run: echo "START_TS=$(date +%s)" >> "$GITHUB_ENV"

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instalar Xvfb, VNC e noVNC
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11vnc novnc websockify libpulse0 libxkbfile1 libxcb-xinerama0

      - name: Subir display virtual + VNC + noVNC
        run: |
          VNC_PASS=$(openssl rand -hex 6)
          echo "VNC_PASS=$VNC_PASS" >> "$GITHUB_ENV"

          Xvfb :99 -screen 0 1280x1024x24 &
          sleep 3
          x11vnc -display :99 -forever -shared -passwd "$VNC_PASS" -localhost -rfbport 5900 -bg -quiet
          websockify --web=/usr/share/novnc 6080 localhost:5900 > /tmp/novnc.log 2>&1 &
          sleep 2

      - name: Subir cloudflared (quick tunnel) e logar acesso
        run: |
          curl -fsSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          ./cloudflared tunnel --url http://localhost:6080 --no-autoupdate > /tmp/cf.log 2>&1 &

          URL=""
          for i in $(seq 1 30); do
            URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' /tmp/cf.log | head -n1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done

          FULL="$URL/vnc.html?autoconnect=1&resize=scale&password=$VNC_PASS"

          echo "=============================================="
          echo "URL BASE: $URL"
          echo "URL DIRETA: $FULL"
          echo "SENHA: $VNC_PASS"
          echo "=============================================="
          {
            echo "### Acesso ao Android 10"
            echo "URL direta: $FULL"
            echo ""
            echo "Senha: \`$VNC_PASS\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Criar script keep-alive
        run: |
          cat > /tmp/keepalive.sh <<'EOF'
          #!/usr/bin/env bash
          adb shell getprop ro.build.version.release
          DEADLINE=$(( START_TS + 355*60 ))
          echo "Emulador no ar até $(date -d @$DEADLINE)"
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            sleep 60
          done
          echo "Tempo esgotado, encerrando."
          EOF
          chmod +x /tmp/keepalive.sh

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          disable-animations: false
          emulator-options: -no-snapshot -noaudio -no-boot-anim -no-metrics -gpu swiftshader_indirect -memory 3072
          script: bash /tmp/keepalive.sh
