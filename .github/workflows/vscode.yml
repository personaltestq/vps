name: VS Code Server (temporary)

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'Senha do VS Code'
        required: true
        default: 'changeme123'

permissions:
  contents: read

jobs:
  vscode:
    runs-on: windows-2022
    timeout-minutes: 350   # 5h50 — margem pra não ser morto pelo teto de 6h
    steps:
      - name: Install code-server
        run: |
          curl -fsSL https://code-server.dev/install.sh | sh

      - name: Configure code-server
        run: |
          mkdir -p ~/.config/code-server
          cat > ~/.config/code-server/config.yaml <<EOF
          bind-addr: 127.0.0.1:8080
          auth: password
          password: ${{ inputs.password }}
          cert: false
          EOF

      - name: Install cloudflared
        run: |
          curl -L --output /tmp/cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb

      - name: Prepare workspace folder
        run: |
          sudo mkdir -p /workspaces/vps
          sudo chown -R runner:runner /workspaces/vps
          chmod -R 777 /workspaces/vps

      - name: Start code-server + tunnel
        run: |
          # 1) sobe o code-server
          code-server > /tmp/code-server.log 2>&1 &
          CS_PID=$!
          sleep 5
          if ! kill -0 $CS_PID 2>/dev/null; then
            echo "❌ code-server não subiu"
            cat /tmp/code-server.log
            exit 1
          fi

          # 2) sobe o quick tunnel
          cloudflared tunnel --url http://localhost:8080 > /tmp/cloudflared.log 2>&1 &
          CF_PID=$!

          # 3) espera a URL aparecer no log
          URL=""
          for i in $(seq 1 30); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -1)
            [ -n "$URL" ] && break
            sleep 2
          done
          if [ -z "$URL" ]; then
            echo "❌ tunnel não subiu"
            cat /tmp/cloudflared.log
            exit 1
          fi

          # 4) publica no summary da run
          {
            echo "### ✅ VS Code Server online"
            echo ""
            echo "🔗 **URL**: $URL"
            echo ""
            echo "🔑 **Senha**: \`${{ inputs.password }}\`"
            echo ""
            echo "⏱️ **Teto**: ~5h50 (timeout do job)"
            echo ""
            echo "⚠️ Tudo em \`~\` morre quando o job terminar."
          } >> $GITHUB_STEP_SUMMARY

          echo "URL:  $URL"
          echo "Senha: ${{ inputs.password }}"

          # 5) mantém o job vivo e monitora os dois processos
          while kill -0 $CS_PID 2>/dev/null && kill -0 $CF_PID 2>/dev/null; do
            sleep 30
          done
          echo "⚠️ algum processo caiu — encerrando"
