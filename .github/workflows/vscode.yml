name: WINDOWS RDP - CLOUDFLARE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Setup Cloudflared
        uses: AnimMouse/setup-cloudflared@v2

      - name: Enable Windows RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
          Write-Host "✅ RDP Enabled Successfully!"

      - name: Set Administrator Password
        run: |
          Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "P@ssw0rd123!" -Force)
          Write-Host "✅ Password Configured!"

      - name: Start Cloudflare Tunnel
        run: |
          # Roda o cloudflared em background e salva o log num arquivo
          Start-Process -FilePath "cloudflared.exe" -ArgumentList "tunnel --url tcp://localhost:3389" -RedirectStandardError "tunnel.log" -NoNewWindow
          
          # Espera 10 segundos pro túnel gerar a URL
          Start-Sleep -Seconds 10
          
          # Procura a URL no log
          $log = Get-Content "tunnel.log" -Raw
          if ($log -match 'https://[a-z0-9-]+\.trycloudflare\.com') {
              $url = $matches[0]
              Write-Host "✅ TUNNEL STARTED!"
              Write-Host "URL: $url"
              Write-Host "USERNAME: runneradmin"
              Write-Host "PASSWORD: P@ssw0rd123!"
              
              # Joga no resumo do job para ficar fácil de achar
              echo "### ✅ Windows RDP Online" >> $env:GITHUB_STEP_SUMMARY
              echo "🔗 **Hostname do Túnel:** $url" >> $env:GITHUB_STEP_SUMMARY
              echo "👤 **Usuário:** runneradmin" >> $env:GITHUB_STEP_SUMMARY
              echo "🔑 **Senha:** P@ssw0rd123!" >> $env:GITHUB_STEP_SUMMARY
          } else {
              Write-Host "❌ Erro ao gerar o túnel:"
              Get-Content "tunnel.log"
              exit 1
          }

      - name: Keep Session Alive
        run: |
          Write-Host "⏳ Session Active - Keeping alive..."
          while ($true) { Start-Sleep -Seconds 60 }
