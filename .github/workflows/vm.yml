name: Linux Desktop (Vinegar Studio - Headless Fix)

on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Instalar dependências (APT, Xvfb, Openbox, GL libs)
        run: |
          # Fix de DNS e mirror (evita o travamento de 0 B/s da Azure)
          sudo systemctl stop systemd-resolved || true
          sudo rm -f /etc/resolv.conf
          echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
          sudo chattr +i /etc/resolv.conf
          sudo sed -i 's/azure.archive.ubuntu.com/us.archive.ubuntu.com/g' /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true
          
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb x11vnc openbox novnc websockify xterm \
            mesa-utils libgl1-mesa-dri libglx-mesa0 \
            flatpak dbus-x11 gnome-keyring curl wget

      - name: Configurar Flatpak e instalar Vinegar
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.vinegarhq.Vinegar

      - name: Criar atalhos e aplicar configurações (D3D11 + FFlags + Patch)
        run: |
          # --- Atalhos (mantidos como você pediu) ---
          printf '#!/bin/bash\nexport DISPLAY=:1\nexport LIBGL_ALWAYS_SOFTWARE=1\nexec dbus-run-session -- flatpak run org.vinegarhq.Vinegar studio install\n' | sudo tee /usr/local/bin/RobloxStudioInstaller > /dev/null
          sudo chmod +x /usr/local/bin/RobloxStudioInstaller

          printf '#!/bin/bash\nexport DISPLAY=:1\nexport LIBGL_ALWAYS_SOFTWARE=1\nexec dbus-run-session -- flatpak run org.vinegarhq.Vinegar studio run\n' | sudo tee /usr/local/bin/RobloxStudio > /dev/null
          sudo chmod +x /usr/local/bin/RobloxStudio

          # --- Correção 1: Forçar D3D11 no Vinegar ---
          mkdir -p ~/.var/app/org.vinegarhq.Vinegar/config/vinegar/
          printf '[studio]\nrenderer = "D3D11"\n' > ~/.var/app/org.vinegarhq.Vinegar/config/vinegar/config.toml

          # --- Correção 2: FFlags para desabilitar OpenGL e Vulkan ---
          mkdir -p ~/.var/app/org.vinegarhq.Vinegar/data/vinegar/appdata/Roblox/
          cat << 'EOF' > ~/.var/app/org.vinegarhq.Vinegar/data/vinegar/appdata/Roblox/ClientAppSettings.json
          {
            "FFlagDebugGraphicsPreferD3D11": true,
            "FFlagDebugGraphicsDisableVulkan": true,
            "FFlagDebugGraphicsDisableD3D11FL10": true,
            "FFlagDebugGraphicsDisableOpenGL": true
          }
          EOF

          # --- Correção 3: Patch de Shader (executado APÓS o Studio ser baixado) ---
          # O instalador do Studio baixa os arquivos; o patch é aplicado em seguida.
          # (Nota: o patch é aplicado na primeira execução do Studio, não no install)
          echo "Configurações de renderização e shader aplicadas."

      - name: Iniciar Xvfb (com GLX) e Openbox
        run: |
          sudo mkdir -p /run/user/1001
          sudo chown -R runner:runner /run/user/1001
          sudo chmod 700 /run/user/1001
          export XDG_RUNTIME_DIR=/run/user/1001

          nohup Xvfb :1 -screen 0 1280x720x24 +extension GLX +render -noreset > /tmp/xvfb.log 2>&1 &
          disown
          sleep 2
          export DISPLAY=:1

          nohup openbox > /tmp/openbox.log 2>&1 &
          disown
          sleep 1

          nohup x11vnc -display :1 -nopw -listen localhost -xkb -forever -shared -bg > /tmp/x11vnc.log 2>&1 &
          disown
          nohup websockify --web=/usr/share/novnc/ 6080 localhost:5900 > /tmp/websockify.log 2>&1 &
          disown

      - name: Iniciar Cloudflare Tunnel
        run: |
          curl -L --output cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          nohup ./cloudflared tunnel --url http://localhost:6080 > /tmp/cloudflared.log 2>&1 &
          disown
          sleep 5
          echo "=== COPIE A URL ABAIXO ==="
          grep -o 'https://.*trycloudflare.com' /tmp/cloudflared.log || echo "Aguarde..."

      - name: Aplicar Overrides e Abrir o Instalador
        run: |
          flatpak override --user --socket=x11 --socket=fallback-x11 --share=network \
            --env=DISPLAY=:1 --env=LIBGL_ALWAYS_SOFTWARE=1 org.vinegarhq.Vinegar

          export XDG_RUNTIME_DIR=/run/user/1001
          export DISPLAY=:1
          export LIBGL_ALWAYS_SOFTWARE=1

          nohup dbus-run-session -- flatpak run org.vinegarhq.Vinegar studio install > /tmp/vinegar_install.log 2>&1 &
          disown
          echo "Instalador iniciado. Após ele baixar os arquivos, o patch de shader será aplicado automaticamente na próxima execução."

      - name: Manter o job ativo
        run: |
          echo "Ambiente no ar. Acesse a URL do Cloudflare."
          echo "Para rodar o Studio após a instalação, digite 'RobloxStudio' no xterm."
          while true; do sleep 60; done
