name: Linux Desktop (Vinegar Studio)

on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout (opcional)
        uses: actions/checkout@v4

      - name: Corrigir APT (Azure Bug) e instalar dependências mínimas
        run: |
          echo "[+] Caçando o mirror da Azure em TODOS os arquivos do APT..."
          # A correção exata que o pessoal do Reddit recomendou
          grep -rl azure.archive.ubuntu.com /etc/apt | xargs -r sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g'
          
          # Remove os repositórios da Microsoft que só atrasam a vida
          sudo find /etc/apt/sources.list.d/ -name "*microsoft*" -exec mv {} {}.bak \; 2>/dev/null || true
          sudo find /etc/apt/sources.list.d/ -name "*vscode*" -exec mv {} {}.bak \; 2>/dev/null || true
          
          echo "[+] Limpando cache velho..."
          sudo rm -rf /var/lib/apt/lists/*
          
          echo "[+] Atualizando..."
          sudo apt update
          
          echo "[+] Instalando pacotes (sem recomendações inúteis)..."
          # --no-install-recommends evita puxar 100+ pacotes de fontes e áudio
          sudo apt install -y --no-install-recommends \
            xvfb x11vnc icewm novnc websockify \
            mesa-utils libgl1-mesa-dri libglx-mesa0 \
            flatpak dbus-x11 curl wget gnome-keyring

      - name: Configurar Flatpak e instalar Vinegar
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.vinegarhq.Vinegar

      - name: Iniciar Xvfb, IceWM, VNC e Cloudflare Tunnel
        run: |
          nohup Xvfb :1 -screen 0 1280x720x24 > /tmp/xvfb.log 2>&1 &
          disown
          export DISPLAY=:1
          sleep 2

          nohup icewm > /tmp/icewm.log 2>&1 &
          disown
          sleep 1

          nohup x11vnc -display :1 -nopw -listen localhost -xkb -forever -shared -bg > /tmp/x11vnc.log 2>&1 &
          disown

          nohup websockify --web=/usr/share/novnc/ 6080 localhost:5900 > /tmp/websockify.log 2>&1 &
          disown

          curl -L --output cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          nohup ./cloudflared tunnel --url http://localhost:6080 > /tmp/cloudflared.log 2>&1 &
          disown
          
          sleep 5
          echo "=== COPIE A URL ABAIXO ==="
          grep -o 'https://.*trycloudflare.com' /tmp/cloudflared.log || echo "Ainda não gerou a URL, aguarde..."

      - name: Iniciar Vinegar (Roblox Studio) com renderização por software
        run: |
          export DISPLAY=:1
          export LIBGL_ALWAYS_SOFTWARE=1
          nohup dbus-run-session -- flatpak run org.vinegarhq.Vinegar studio run > /tmp/vinegar.log 2>&1 &
          disown
          echo "Vinegar iniciado. O log estará em /tmp/vinegar.log"

      - name: Manter o job ativo (aguardar interação)
        run: |
          echo "Ambiente no ar. Acesse a URL do Cloudflare acima."
          while true; do sleep 60; done
